<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝你生日快乐！愿所有美好如期而至</title>
    <!-- 引入 Tailwind CSS 样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Canvas 烟花/彩带库 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between">

    <!-- 动态星空画布 -->
    <canvas id="starfield"></canvas>

    <!-- 音乐控制提示条 -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="playMusicTip()" class="glass-card px-4 py-2 rounded-full text-xs font-medium flex items-center gap-2 hover:bg-white/10 transition shadow-lg text-pink-300 border-pink-500/30">
            <span class="animate-spin text-base">🎵</span> 
            <span>浪漫生日曲</span>
        </button>
    </div>

    <!-- 主体内容区 -->
    <main class="max-w-4xl mx-auto px-4 py-12 w-full flex-grow flex flex-col items-center justify-center text-center">
        
        <!-- 顶部装饰标语 -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-card text-pink-400 text-xs tracking-wider mb-6 animate-pulse">
            ✨ 专属定制生日祝福网页 ✨
        </div>

        <!-- 主标题（接单时可直接在此处修改寿星名字） -->
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">
            祝思熠生日快乐！
        </h1>
        <p class="text-gray-400 text-sm sm:text-base max-w-lg mb-10 leading-relaxed">
            愿你此后的每一个日子，眼里有光，心中有爱，所求皆如愿，所行皆坦途。
        </p>

        <!-- AI 互动祝福语卡片 -->
        <div class="glass-card w-full max-w-xl p-6 sm:p-8 rounded-2xl shadow-2xl mb-10 relative overflow-hidden text-left border-l-4 border-l-pink-500">
            <div class="absolute -right-10 -bottom-10 text-9xl opacity-5 select-none">🎂</div>
            <h3 class="text-pink-400 text-sm font-semibold mb-2 flex items-center gap-1">
                <span>💌</span> AI 专属寄语
            </h3>
            <p id="wishText" class="text-gray-200 text-base sm:text-lg leading-relaxed min-h-[4rem] flex items-center">
                “宇宙山河浪漫，生活点滴温暖，都值得你一路珍藏。祝你岁岁常欢愉，年年皆胜意！”
            </p>
            <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center text-xs text-gray-400">
                <span>—— 来自星空深处的祝福</span>
                <button onclick="changeWish()" class="px-3 py-1 rounded bg-pink-500/20 text-pink-300 hover:bg-pink-500/30 transition">
                    换一条祝福 🔄
                </button>
            </div>
        </div>

        <!-- 珍贵回忆瞬间 (图片区域：接单时可替换为客户提供的图片直链或本地路径) -->
        <div class="w-full mb-12 text-left">
            <h3 class="text-xl font-bold mb-6 text-center text-gray-200 flex items-center justify-center gap-2">
                <span>📸</span> 珍贵回忆瞬间
            </h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <!-- 图片 1 -->
                <div class="glass-card rounded-xl overflow-hidden group shadow-lg">
                    <div class="h-48 overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=600&q=80" alt="回忆1" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <div class="p-4 text-center">
                        <p class="text-xs text-pink-300 font-medium">灿烂笑脸</p>
                        <p class="text-xs text-gray-400 mt-1">愿你每天都笑得像花儿一样</p>
                    </div>
                </div>

                <!-- 图片 2 -->
                <div class="glass-card rounded-xl overflow-hidden group shadow-lg">
                    <div class="h-48 overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?auto=format&fit=crop&w=600&q=80" alt="回忆2" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <div class="p-4 text-center">
                        <p class="text-xs text-pink-300 font-medium">顶峰相见</p>
                        <p class="text-xs text-gray-400 mt-1">去追逐所有闪闪发光的梦想</p>
                    </div>
                </div>

                <!-- 图片 3 -->
                <div class="glass-card rounded-xl overflow-hidden group shadow-lg">
                    <div class="h-48 overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80" alt="回忆3" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <div class="p-4 text-center">
                        <p class="text-xs text-pink-300 font-medium">温暖陪伴</p>
                        <p class="text-xs text-gray-400 mt-1">感恩生命中所有的美好遇见</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 互动惊喜按钮 -->
        <button onclick="triggerSurprise()" class="px-8 py-4 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-lg shadow-lg hover:shadow-pink-500/25 hover:scale-105 active:scale-95 transition">
            🎉 点击开启生日魔法彩蛋 🎉
        </button>

    </main>

    <!-- 页脚版权 -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-white/5">
        Designed with AI for Birthday Surprise &bull; Made with Love
    </footer>

    <!-- JavaScript 交互脚本 -->
    <script>
        function playMusicTip() {
            alert("浪漫星空已开启，祝你今天拥有好心情！🎂");
        }

        // 动态星空特效
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 8000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateStars();

        // AI 祝福语切换库
        const wishes = [
            "“宇宙山河浪漫，生活点滴温暖，都值得你一路珍藏。祝你岁岁常欢愉，年年皆胜意！”",
            "“愿你的每一天都如画般美丽，愿你的深情不被辜负，愿你走过山山水水，依旧觉得人间值得。”",
            "“把烦恼清空，把快乐充值，愿你在新的一岁里：暴瘦、暴富、被爱，永远笑靥如花！”",
            "“愿你眼中有星辰大海，胸有丘壑万千，心怀炽热，一往无前。生日快乐，独一无二的你！”"
        ];
        let currentWishIndex = 0;

        function changeWish() {
            currentWishIndex = (currentWishIndex + 1) % wishes.length;
            const wishEl = document.getElementById('wishText');
            wishEl.style.opacity = 0;
            setTimeout(() => {
                wishEl.textContent = wishes[currentWishIndex];
                wishEl.style.opacity = 1;
                wishEl.style.transition = "opacity 0.5s ease-in-out";
            }, 200);
        }

        // 彩蛋烟花触发
        function triggerSurprise() {
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff69b4', '#dda0dd', '#ffffff', '#ff1493', '#8a2be2']
            });
        }
    </script>
</body>
</html>
